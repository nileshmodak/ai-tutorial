factory:
  name: polyglot-modernization-factory
  mode: assessment-only
  defaultBranchPrefix: modernization/
  requireCleanWorkingTree: true
  requireHumanApprovalBeforeDeploy: true
  maxConcurrentMigrations: 3

sourceControl:
  provider: github-enterprise
  createPullRequest: false

targets:
  dotnet:
    framework: net10.0
    hosting: openshift
    operatingSystem: linux
  node:
    requestedCompatibilityVersion: "18"
    recommendedProductionTarget: "24"
    requireExplicitEolExceptionForNode18: true
  frontend:
    webServer: nginx
    hosting: openshift

qualityGates:
  build: required
  unitTests: required
  integrationTests: required
  dependencyScan: required
  containerScan: required
  manifestValidation: required
  smokeTest: required
  humanApprovalBeforeDeploy: required
